<!DOCTYPE html>
<!--
  Manual test of lcg.Landing (the initial focus and announcements on page load).

  Open this file in a browser directly (no server is needed) and go through
  the scenarios with a screen reader.  Each scenario reloads the whole page,
  as the server would.  Test both with the automatic reading of web pages on
  and off (VoiceOver: VoiceOver Utility, Web, "Automatically speak the web
  page").  The expected announcements are described on each page.  The debug
  log at the bottom (hidden from screen readers) shows the focused element
  and its description after landing.

  Copyright (C) 2026 Tomáš Cerha <cerha@truecode.cz>
  License: GNU General Public License version 2 or later (see lcg.js).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lcg.Landing test</title>
<link rel="stylesheet" href="../../resources/css/lcg-widgets.css">
<script src="../../resources/scripts/jquery.min.js"></script>
<script src="../lcg.js"></script>
<style>
  body { font-family: sans-serif; max-width: 50em; margin: 1em auto; padding: 0 1em; }
  nav ul { display: flex; flex-wrap: wrap; gap: .3em 1em; padding: 0; list-style: none; }
  nav a[aria-current] { font-weight: bold; }
  .expected { border: 1px solid #888; padding: .5em 1em; background: #f4f4f4; }
  .message { padding: .5em 1em; margin: 1em 0; }
  .message.info { background: #dfd; }
  .message.error { background: #fdd; }
  .results { font-weight: bold; }
  .side-panel { border-left: 3px solid #ccc; padding-left: 1em; margin: 1em 0; }
  tr.found { background: #ffd; }
  #log { background: #222; color: #ddd; padding: .5em; white-space: pre-wrap; }
</style>
</head>
<body>
<nav aria-label="Scenarios"><ul id="scenarios"></ul></nav>
<main>
  <h1 id="main-heading" tabindex="-1"></h1>
  <div id="messages"></div>
  <div class="expected" id="expected"></div>
  <div id="content"></div>
</main>
<h2 aria-hidden="true">Debug log</h2>
<pre id="log" aria-hidden="true"></pre>

<script>
"use strict";

const params = new URLSearchParams(window.location.search)
const scenario = params.get('scenario') || 'heading'
const query = params.get('query')

const SCENARIOS = {
    'heading': "Main heading",
    'message': "Message",
    'login-error': "Login error",
    'search': "Search",
    'found-record': "Found record",
    'deferred': "Deferred content",
    'slow-deferred': "Too slow deferred content",
    'live': "Changes after landing",
}

function uri(name, fragment) {
    return '?scenario=' + name + (fragment ? '#' + fragment : '')
}

function message(text, kind) {
    // Emulates Wiking's messages rendered by the server.
    $('#messages').append($('<div class="message">').addClass(kind).text(text)
                          .attr('data-lcg-announce', kind === 'error' ? 'alert' : 'status'))
}

function expected(html) {
    $('#expected').html('<strong>Expected:</strong> ' + html)
}

function search_form(id, focus_fragment) {
    // Emulates the search controls of Pytis browse form ('focus_fragment'
    // true) or the side panel search form of Biblio (false).
    return $('<form method="GET">').attr('action', uri('search', focus_fragment ? 'focus-' + id : ''))
        .append($('<input type="hidden" name="scenario" value="search">'))
        .append($('<label>').attr('for', id).text("Search expression: "))
        .append($('<input type="search" name="query">').attr('id', id).val(focus_fragment ? query : ''))
        .append(' ', $('<button type="submit">').text("Search"))
}

function results(count) {
    return $('<div class="results">').text(`Found ${count} records matching the search expression.`)
}

function table(found) {
    let tbody = $('<tbody>')
    for (let i = 1; i <= 5; i++) {
        let row = $('<tr>').append($('<td>').text('Record ' + i))
        if (i === found) {
            row.addClass('found').attr({id: 'found-record', tabindex: -1})
        }
        tbody.append(row)
    }
    return $('<table>').append('<thead><tr><th>Title</th></tr></thead>', tbody)
}

function focus_control() {
    // Emulates the handling of '#focus-...' by Pytis and lcg.Dropdown.
    if (window.location.hash.startsWith('#focus-')) {
        let id = window.location.hash.substring(7)
        history.replaceState(history.state, '', window.location.pathname + window.location.search)
        lcg.landing.focus(id, lcg.Landing.CONTROL)
    }
}

for (let [name, title] of Object.entries(SCENARIOS)) {
    let link = $('<a>').attr('href', uri(name)).text(title)
    if (name === scenario) {
        link.attr('aria-current', 'page')
    }
    $('#scenarios').append($('<li>').append(link))
}
$('#main-heading').text(SCENARIOS[scenario])
document.title = SCENARIOS[scenario] + ' - lcg.Landing test'

// Emulates Wiking: the main heading is the default unless the page was
// opened with a fragment or the browser restored the scroll position.
lcg.landing.focus(() => (!window.location.hash && window.scrollY === 0
                         ? document.getElementById('main-heading') : null))

const content = $('#content')

if (scenario === 'heading') {
    expected("The main heading is focused and read, nothing else.")
    content.append($('<p>').text("Some page content."))

} else if (scenario === 'message') {
    message("Your bookmark was saved.", 'info')
    expected("The main heading is focused, followed by the message " +
             "“Your bookmark was saved.” read once.")

} else if (scenario === 'login-error') {
    message("Invalid login or password.", 'error')
    content.append($('<form>').append(
        $('<label for="login">').text("Login: "),
        $('<input id="login" name="login" autofocus>'), ' ',
        $('<label for="password">').text("Password: "),
        $('<input id="password" type="password">'), ' ',
        $('<button type="button">').text("Log in"),
    ))
    expected("The Login field is focused (the 'autofocus' attribute), followed by " +
             "“Invalid login or password.” read once.  After switching to another " +
             "application and back (Cmd+Tab), the field is announced with the " +
             "message again.  After moving to the Password field and back " +
             "(Tab, Shift+Tab), the field is announced without the message.")

} else if (scenario === 'search') {
    content.append(search_form('search-field', true))
    if (query !== null) {
        let r = results(query.length * 7)
        content.append(r)
        lcg.landing.announce(r)
    }
    content.append(table(null))
    content.append($('<div class="side-panel">').append(
        $('<h2>').text("Side panel"), search_form('side-search', false)))
    focus_control()
    expected("Before searching: the main heading.  After searching from the field above " +
             "the list: the search field stays focused, followed by “Found N records…” " +
             "read once.  After searching from the side panel: the main heading, " +
             "followed by “Found N records…” read once.")

} else if (scenario === 'found-record') {
    content.append(table(3))
    lcg.landing.focus('found-record', lcg.Landing.CONTENT)
    expected("Record 3 (highlighted row) is focused, not the main heading.")

} else if (scenario === 'deferred' || scenario === 'slow-deferred') {
    let delay = scenario === 'deferred' ? 1200 : 5000
    content.append($('<p id="loading">').text("Loading…"))
    // Emulates an asynchronously loaded form (Pytis) with a search field
    // which reloaded the page.
    lcg.landing.defer(new Promise(resolve => setTimeout(() => {
        let r = results(42)
        $('#loading').replaceWith(search_form('async-search', true), r, table(null))
        $('#async-search').val('async')
        lcg.landing.focus('async-search', lcg.Landing.CONTROL)
        lcg.landing.announce(r)
        resolve()
    }, delay)))
    if (scenario === 'deferred') {
        expected("The content appears after about a second.  Then the search field is " +
                 "focused, followed by “Found 42 records…” read once.  The main heading " +
                 "is not announced.")
    } else {
        expected("The page lands on the main heading after 3 seconds (the limit of " +
                 "waiting).  The content appears after 5 seconds; the focus moves to " +
                 "the search field and “Found 42 records…” is announced through " +
                 "the live region.")
    }

} else if (scenario === 'live') {
    let count = 0
    content.append(
        $('<button type="button">').text("Add item").on('click', () => {
            count++
            $('#items').append($('<li>').text('Item ' + count))
            lcg.landing.announce(`Item ${count} added.`)
        }), ' ',
        $('<button type="button">').text("Repeat").on('click', () => {
            lcg.landing.announce("The same message.")
        }), ' ',
        $('<button type="button">').text("Two messages").on('click', () => {
            lcg.landing.announce("First message.")
            lcg.landing.announce("Second message.")
        }), ' ',
        $('<button type="button">').text("Error").on('click', () => {
            lcg.landing.announce("Something went wrong.", true)
        }),
        $('<ul id="items">'),
    )
    expected("The main heading on load.  “Add item” announces “Item N added.” " +
             "while the focus stays on the button.  “Repeat” announces “The same " +
             "message.” on every press.  “Two messages” announces both together.  " +
             "“Error” announces the error (assertively).")
}

function log() {
    let element = document.activeElement
    let ids = (element?.getAttribute('aria-describedby') || '').split(' ').filter(x => x)
    $('#log').text([
        `${(performance.now() / 1000).toFixed(1)} s`,
        'Focused: ' + (element === document.body ? 'body'
                       : element.tagName.toLowerCase() + (element.id ? '#' + element.id : '')),
        'Description: ' + (ids.map(id => document.getElementById(id)?.textContent).join(' | ')
                           || '-'),
        'Live regions: ' + ($('.lcg-assistive[role]').map((i, e) => (
            `${e.getAttribute('role')}: "${e.textContent}"`)).get().join(', ')),
    ].join('\n'))
}
log()
setInterval(log, 500)
</script>
</body>
</html>
