name: Run Tests

on:

  push:
    branches:
      - '**'
  pull_request:

jobs:

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: [3.11]

    env:
      MPLBACKEND: svg

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fontconfig fonts-freefont-ttf gettext rsync \
                       build-essential pkg-config libcairo2-dev

      - name: Create virtualenv
        run: |
          python -m venv .venv
          echo "${PWD}/.venv/bin" >> $GITHUB_PATH

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install --group build --group test --group lint

      - name: Build and install the wheel
        run: |
          make build
          pip install $(echo dist/lcg_framework-*-any.whl)[all]

      - name: Run tests
        run: make test
